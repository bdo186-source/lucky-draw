<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سحب اليوم</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--text:#1e1b2e;--muted:#6b6785;--accent:#7c3aed;--line:#e4e0f0;--err:#c0262d;--ok:#12805c}
@media (prefers-color-scheme:dark){:root{--bg:#14121f;--card:#1f1c30;--text:#f0eefb;--muted:#a29dc0;--line:#322e4a;--err:#ff7b80;--ok:#4cd2a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));max-width:440px;margin-inline:auto}
h1{font-size:22px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-top:10px;direction:ltr;text-align:left}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;width:100%;margin-top:10px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:disabled{opacity:.5}
.m{color:var(--muted);font-size:13px;margin:6px 0 0}
#msg{margin-top:10px;font-weight:600;font-size:14px;min-height:20px}
#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
.big{font-size:34px;font-weight:800;margin:6px 0}
.code{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>🎟️ سحب اليوم المجاني</h1>

<div class="card" id="authView" hidden>
  <b>تسجيل الدخول أو إنشاء حساب</b>
  <input id="em" type="email" placeholder="name@example.com" autocomplete="email">
  <input id="pw" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
  <button id="up">إنشاء حساب</button>
  <button id="in" class="ghost">لدي حساب، تسجيل دخول</button>
</div>

<div class="card" id="homeView" hidden>
  <p class="m" id="who" style="direction:ltr;text-align:right"></p>
  <div class="big">💎 <span id="gems">0</span></div>
  <p class="m">رمز الإحالة الخاص بك:</p>
  <p class="code" id="ref" style="font-weight:700;margin:4px 0 0"></p>
  <button id="out" class="ghost">تسجيل الخروج</button>
</div>

<div id="msg" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDmzyC9nr9sjRSiS0jMmm__WFZ1qUeCOTA",
  authDomain: "easy-tasks-cc761.firebaseapp.com",
  projectId: "easy-tasks-cc761",
  storageBucket: "easy-tasks-cc761.firebasestorage.app",
  messagingSenderId: "704952686829",
  appId: "1:704952686829:web:2b891138d5def47f1754e4"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);

const ERR = {
  "auth/email-already-in-use": "هذا الإيميل مسجل مسبقاً، استخدم تسجيل الدخول",
  "auth/invalid-email": "صيغة الإيميل غير صحيحة",
  "auth/weak-password": "كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل",
  "auth/invalid-credential": "الإيميل أو كلمة المرور غير صحيحة",
  "auth/network-request-failed": "لا يوجد اتصال بالإنترنت",
  "auth/too-many-requests": "محاولات كثيرة، انتظر قليلاً ثم حاول مجدداً",
  "permission-denied": "رفض السيرفر العملية، راجع قواعد Firestore"
};
function say(t, cls){ const m = $("msg"); m.textContent = t || ""; m.className = cls || ""; }
function fail(e){ say(ERR[e.code] || ("حدث خطأ: " + (e.code || e.message)), "err"); }
async function busy(fn){ ["up","in","out"].forEach(i => $(i).disabled = true); try { await fn(); } catch(e){ fail(e); } ["up","in","out"].forEach(i => $(i).disabled = false); }

function creds(){ return [$("em").value.trim().toLowerCase(), $("pw").value]; }
$("up").onclick = () => busy(async () => { const [e,p] = creds(); say("جاري إنشاء الحساب..."); await createUserWithEmailAndPassword(auth, e, p); });
$("in").onclick = () => busy(async () => { const [e,p] = creds(); say("جاري تسجيل الدخول..."); await signInWithEmailAndPassword(auth, e, p); });
$("out").onclick = () => busy(() => signOut(auth));

async function ensureUserDoc(user){
  const ref = doc(db, "users", user.uid);
  let snap = await getDoc(ref);
  if (!snap.exists()){
    await setDoc(ref, { email: user.email, gems: 30, refCode: user.uid.slice(0, 6).toLowerCase(), createdAt: serverTimestamp() });
    snap = await getDoc(ref);
  }
  return snap.data();
}

onAuthStateChanged(auth, async user => {
  if (!user){ $("authView").hidden = false; $("homeView").hidden = true; say(""); return; }
  try {
    const d = await ensureUserDoc(user);
    $("who").textContent = d.email;
    $("gems").textContent = d.gems;
    $("ref").textContent = d.refCode;
    $("authView").hidden = true; $("homeView").hidden = false;
    say("تم تسجيل الدخول بنجاح", "ok");
  } catch(e){ fail(e); }
});
</script>
</body>
</html>
